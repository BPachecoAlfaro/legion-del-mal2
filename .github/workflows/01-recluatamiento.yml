name: Reclutamiento de Agente

on:
  workflow_dispatch:

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el lider de la gelion del mal"

      - name: Reporte de identidad
        run: |
          echo "Reporte de identidad"
          echo ""
          echo "Nombre clave ${{ github.actor }}"
          echo ""
          echo "Contexto de Github"
          echo "Repo ${{ github.repository }}"
          echo "Operacion ${{ github.sha }}"
          echo "Metadata: ${{ toJson(github)}}"
      - name: Capacidades del agente
        run: |
          echo "Capacidades detectada"
          echo "Sistema operativo"
          uname -a
          echo "Habilidades tecnica"
          node --version
          git --version
          python3 --version
      - name: Reconocimineto del terreno
        run: |
          echo "Reconocimiento del terreo"
          ls /
