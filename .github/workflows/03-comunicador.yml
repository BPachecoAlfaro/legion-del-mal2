# This is a basic workflow to help you get started with Actions

name: Comunicador de la legions

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Lex Luthor2

      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un exito"

      cow-characters:
        description: "Elige un cow"
        required: true
        type: choice
        options:
          - eyes
          - R2-D2
          - banana

      prioridad:
        description: "nivel de prioridad?"
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica

jobs:
  # This workflow contains a single job called "build"
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - name: Imprimir inputs
        run: |
          echo "=================================="
          echo "      transmisor intercertapa     "
          echo "=================================="
          echo ""
          echo "De : ${{ inputs.villano }}"
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:$M UTC")"
          echo "====== Mensaje ======"
          cowsay -f ${{ inputs.cow-characters }} "${{ inputs.mensaje}}"
          echo ""
          echo "--- ${{ inputs.villano }}"
          echo "..."
