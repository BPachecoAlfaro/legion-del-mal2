name: Brainiac revisa nuevos issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  responder-issue:
    name: Responder al creador del issue
    runs-on: ubuntu-latest

    steps:
      - name: Publicar respuesta de Brainiac
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '🤖 **Brainiac ha recibido tu issue.**',
              '',
              'Tu issue está siendo revisado por Brainiac. Te informaremos aquí cuando tengamos novedades.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enviar aviso por correo electrónico
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Brainiac] Nuevo issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          to: bpachecoalfaro@gmail.com
          from: "Brainiac <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Brainiac ha recibido un nuevo issue y lo está revisando.

            Título: ${{ github.event.issue.title }}
            Número: #${{ github.event.issue.number }}
            Creado por: ${{ github.event.issue.user.login }}
            Enlace: ${{ github.event.issue.html_url }}
